name: auto_start_flutter
description: Manage background execution on Android, iOS, macOS, Windows and Linux - OEM auto-start settings, battery optimization, exact alarms, boot callbacks and scheduled headless tasks.
version: 1.6.0
homepage: https://github.com/seena98/auto_start_flutter
repository: https://github.com/seena98/auto_start_flutter
#authors:  [Seena Ashr]


environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  # This section identifies this Flutter project as a plugin project.
  # The 'pluginClass' and Android 'package' identifiers should not ordinarily
  # be modified. They are used by the tooling to maintain consistency when
  # adding or updating assets for this project.
  plugin:
    platforms:
      android:
        package: co.techFlow.auto_start_flutter
        pluginClass: AutoStartFlutterPlugin
      ios:
        pluginClass: AutoStartFlutterPlugin
      windows:
        pluginClass: AutoStartFlutterPlugin
      macos:
        pluginClass: AutoStartFlutterPlugin
      linux:
        pluginClass: AutoStartFlutterPlugin
